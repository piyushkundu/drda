<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered Hindi typing platform - Type in Hinglish, get Shudh Hindi. Convert KrutiDev to Unicode. Powered by Groq AI.">
    <title>हिंदी लेखक | AI Hindi Writer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header / Topbar -->
<header class="topbar">
    <div class="topbar-left">
        <div class="logo-icon">हि</div>
        <div class="logo-text">हिंदी लेखक</div>
        <div class="live-badge on" id="liveBadge">
            <span class="live-dot"></span>
            <span id="liveBadgeText">LIVE Auto-Convert</span>
        </div>
    </div>
    
    <!-- Toolbar Actions -->
    <div class="toolbar" id="toolbar">
        <div class="toolbar-group">
            <select class="toolbar-select" id="fontSizeSelect" title="Font Size">
                <option value="14">14px</option>
                <option value="16" selected>16px</option>
                <option value="18">18px</option>
                <option value="20">20px</option>
                <option value="24">24px</option>
                <option value="28">28px</option>
                <option value="32">32px</option>
            </select>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" data-command="bold" data-tooltip="Bold (Ctrl+B)"><b>B</b></button>
            <button class="toolbar-btn" data-command="italic" data-tooltip="Italic (Ctrl+I)"><i>I</i></button>
            <button class="toolbar-btn" data-command="underline" data-tooltip="Underline (Ctrl+U)"><u>U</u></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" data-command="justifyLeft" data-tooltip="Align Left">≡</button>
            <button class="toolbar-btn" data-command="justifyCenter" data-tooltip="Center">≡</button>
            <button class="toolbar-btn" data-command="justifyRight" data-tooltip="Align Right">≡</button>
        </div>
    </div>

    <div class="topbar-right">
        <button class="btn btn-outline" id="btnCopyUnicode">
            <span class="icon">📋</span> Copy Hindi
        </button>
        <button class="btn btn-accent" id="btnCopyKrutidev">
            <span class="icon">✨</span> Copy as KrutiDev
        </button>
    </div>
</header>

<!-- Main Workspace -->
<main class="workspace">
    <div class="a4-container">
        <!-- The A4 Page Editor -->
        <div class="a4-page" id="a4Editor" contenteditable="true" spellcheck="false" placeholder="यहाँ Hinglish में लिखें... (e.g., 'social audit team sdasya hetu avedan patr')"></div>
    </div>
</main>

<!-- Status Bar -->
<div class="status-bar">
    <div class="status-bar-left">
        <span class="status-item">Powered by Groq AI</span>
        <span class="status-item" id="conversionStatus">Ready</span>
    </div>
    <div class="status-bar-right">
        <span class="status-item" id="inputWordCount">Words: 0</span>
        <span class="status-item" id="inputCharCount">Chars: 0</span>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
